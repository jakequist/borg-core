[workspace]
resolver = "3"
members = [
    "crates/borg-core",
    "crates/borg-storage",
    "crates/borg-storage-sqlite",
    "crates/borg-protocol",
    "crates/borg-exec",
    "crates/borg-exec-process",
    "crates/borg-exec-native",
    "crates/borg-engine",
    "crates/borg-host",
    "crates/borg-cli",
    "crates/borg-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/meteor-hq/borg"

[workspace.dependencies]
borg-core = { path = "crates/borg-core" }
borg-storage = { path = "crates/borg-storage" }
borg-storage-sqlite = { path = "crates/borg-storage-sqlite" }
borg-protocol = { path = "crates/borg-protocol" }
borg-exec = { path = "crates/borg-exec" }
borg-exec-process = { path = "crates/borg-exec-process" }
borg-exec-native = { path = "crates/borg-exec-native" }
borg-engine = { path = "crates/borg-engine" }
borg-host = { path = "crates/borg-host" }

async-trait = "0.1"
# "rc" enables Arc<str> — field and struct names are Arc-shared because they repeat across
# every cell and are compared constantly during dependency-index lookups.
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
rmp-serde = "1"
# Content-addressed PIDs are a persisted format and a coordination-free identity scheme (§3.1,
# §17.2): every node must compute the same 32 bytes for the same content, forever. That is a
# cryptographic hash, and hand-rolling one is not a decision anybody should take.
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
