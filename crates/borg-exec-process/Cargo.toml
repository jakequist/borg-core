[package]
name = "borg-exec-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
borg-core.workspace = true
borg-exec.workspace = true
borg-protocol.workspace = true
async-trait.workspace = true
# `net` is here only to accept on a unix socket, and `time` only to give up waiting for one.
tokio = { workspace = true, features = [
    "process",
    "io-util",
    "rt",
    "sync",
    "macros",
    "net",
    "time",
] }
serde_json.workspace = true

[dev-dependencies]
# The pool is about processes running at once, so its tests need a runtime that can actually run
# them at once.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# A worker that speaks the socket transport, for the transport tests to spawn. It is a `[[bin]]`
# rather than an example because `CARGO_BIN_EXE_…` only resolves bin targets, and its source sits
# under `tests/` so that nothing mistakes it for shipped code. Bash cannot open a unix socket
# without `socat` or `nc -U`, neither of which `check.sh` may assume.
[[bin]]
name = "borg-socket-worker-fixture"
path = "tests/fixtures/socket_worker.rs"
