[package]
name = "borg-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
borg-core.workspace = true
borg-storage.workspace = true
borg-exec.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
borg-exec-native.workspace = true
borg-storage-sqlite.workspace = true
# `time` is dev-only: the waiting primitive itself takes no deadline (a deadline is the
# caller's policy), but a test asserting that a wait *does not* return needs one.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
