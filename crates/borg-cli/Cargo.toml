[package]
name = "borg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The crate is borg-cli; the binary users type is `borg`.
[[bin]]
name = "borg"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
borg-core.workspace = true
borg-engine.workspace = true
# What both binaries do to a store: opening one, the operations on it, the sidecars beside it. The
# CLI is a *client* of this and so is `borg-server`; nothing about a command lives in this crate.
borg-host.workspace = true
# `borg generate` speaks §17.5 to a served store rather than being refused by it, which is the one
# place the CLI is a protocol client (SDK-DRAFT §2.6).
borg-protocol.workspace = true
# `time` is what bounds `borg frontier reaches`: a wait with no deadline is a hang.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde.workspace = true
serde_json.workspace = true
